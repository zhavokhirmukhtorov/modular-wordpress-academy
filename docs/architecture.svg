<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .box { fill:#ffffff; stroke:#202124; stroke-width:2; rx:14; }
      .title { font: 700 24px Arial, sans-serif; fill:#202124; }
      .text { font: 17px Arial, sans-serif; fill:#3c4043; }
      .small { font: 15px Arial, sans-serif; fill:#5f6368; }
      .line { stroke:#5f6368; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <text x="500" y="42" text-anchor="middle" class="title">Modular WordPress Academy - Architecture</text>
  <rect x="70" y="105" width="240" height="130" class="box"/>
  <text x="190" y="145" text-anchor="middle" class="title">Academy Core</text>
  <text x="190" y="177" text-anchor="middle" class="text">roles + access</text>
  <text x="190" y="204" text-anchor="middle" class="small">WooCommerce + audit log</text>

  <rect x="380" y="105" width="240" height="130" class="box"/>
  <text x="500" y="145" text-anchor="middle" class="title">Courses</text>
  <text x="500" y="177" text-anchor="middle" class="text">courses + lessons</text>
  <text x="500" y="204" text-anchor="middle" class="small">protected REST API</text>

  <rect x="690" y="105" width="240" height="130" class="box"/>
  <text x="810" y="145" text-anchor="middle" class="title">Progress</text>
  <text x="810" y="177" text-anchor="middle" class="text">completion tracking</text>
  <text x="810" y="204" text-anchor="middle" class="small">custom MySQL table</text>

  <path d="M310 170 L380 170" class="line"/>
  <path d="M620 170 L690 170" class="line"/>

  <rect x="225" y="330" width="240" height="105" class="box"/>
  <text x="345" y="370" text-anchor="middle" class="title">WooCommerce</text>
  <text x="345" y="401" text-anchor="middle" class="small">completed order -> access</text>

  <rect x="535" y="330" width="240" height="105" class="box"/>
  <text x="655" y="370" text-anchor="middle" class="title">Audit Log</text>
  <text x="655" y="401" text-anchor="middle" class="small">business-significant events</text>

  <path d="M345 330 L230 235" class="line"/>
  <path d="M655 330 L810 235" class="line"/>
  <path d="M655 330 L225 235" class="line"/>

  <text x="500" y="490" text-anchor="middle" class="small">Public contracts/actions between modules; no direct access to another plugin's internals.</text>
</svg>
